[project]
name = "odoo-bringout-oca-ocb-account_reconcile_oca"
version = "16.0.0"
description = "Account Reconcile Oca - 
        
        Reconcile addons for Odoo CE accounting
        "
authors = [
    { name = "Ernad Husremovic", email = "hernad@bring.out.ba" }
]
dependencies = [
    "TODO_MAP-account_statement_base>=18.0.0",
    "TODO_MAP-account_reconcile_model_oca>=18.0.0",
    "odoo-bringout-oca-ocb-base_sparse_field>=18.0.0",
    "requests>=2.25.1"
]
readme = "README.md"
requires-python = ">= 3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.urls]
homepage = "https://git.hodi.ba/bringout/project-0"
repository = "https://git.hodi.ba/bringout/project-0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["account_reconcile_oca"]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.4.1",
]
